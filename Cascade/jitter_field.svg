<text x="60" y="44" font-size="22" font-weight="bold" fill="#111">The jitter field: the boundary wanders, and the wander is the depth</text>
<text x="60" y="72" font-size="14" fill="#444">Colour is the sign of the local margin m + xi(k) against octave, where m = n - delta - 2. The frontier is where it changes sign.</text>
<text x="60" y="92" font-size="14" fill="#444">One realisation, the same shape scaled to three depths, so the effect of depth alone is visible. The straight dashed line is the deterministic boundary m = 0.</text>
