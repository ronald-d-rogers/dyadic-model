<text x="46.0" y="300.0" font-size="14" text-anchor="middle" fill="#333" transform="rotate(-90 46 300)">margin  m = n - delta - 2</text>
<text x="100.0" y="552.0" font-size="13" font-weight="bold" fill="#2166ac">below the frontier: dissipation wins (safe)</text>
<text x="620.0" y="552.0" font-size="13" font-weight="bold" fill="#b2182b">above the frontier: the nonlinearity wins</text>
<text x="60" y="582" font-size="11.5" fill="#777">Only the boundary region is shown, and it is narrow: a depth of 0.25 in margin is +/- 0.5 in n - delta, which is why the jitter is invisible in the full (n, delta) plane.</text>
<text x="60" y="601" font-size="11.5" fill="#777">The wobble is synthetic: the real jitter statistics are not known to me. What is exact is the deterministic boundary m = 0 and the fact that the frontier is where the LOCAL margin changes sign.</text>
