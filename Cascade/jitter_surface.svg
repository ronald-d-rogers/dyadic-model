<text x="60" y="44" font-size="22" font-weight="bold" fill="#111">Why delta = 2.7, in 3-D: the jitter depth on the Z axis</text>
<text x="60" y="72" font-size="14" fill="#444">Z is the local exponent. Each ribbon is one spatial dimension: its straight grey line is the mean (n - delta)/2 at delta = 2.7, and the wiggly curve is what is actually realised at that scale.</text>
<text x="60" y="92" font-size="14" fill="#444">The vertical gap between a grey line and its curve is the jitter DEPTH. The ribbon at n = 4.7 = 2 + delta has mean exactly 1, the critical slope, so its wiggles straddle the boundary.</text>
