<text x="456.0" y="259.4" font-size="12" fill="#666">the grey floor is slope = 1, the critical level</text>
<text x="60" y="652" font-size="11.5" fill="#777">The ribbon at n = 4.7 = 2 + delta has mean exactly the critical slope 1, so its wiggles cross the critical floor both ways: that dimension is marginal octave by octave, while the mean still classifies it.</text>
<text x="60" y="671" font-size="11.5" fill="#777">The roughness is synthetic &#8212; the real jitter statistics are not known to me. Exact: the mean plane (n - delta)/2, its crossing of slope 1 at n = 2 + delta, and the reading of the depth as the vertical gap.</text>
