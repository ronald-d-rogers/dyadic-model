<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1200" height="580" fill="#ffffff"/>

  <text x="60" y="44" font-size="23" font-weight="bold" fill="#111">Why delta = 2.7: the jitter is mild, and its MEAN is the number</text>
  <text x="60" y="72" font-size="14.5" fill="#444">delta is the average level of saturation of Bernstein's inequality &#8212; the slope of the log-log line, read down from the delta = 0 ceiling.</text>
  <text x="60" y="92" font-size="14.5" fill="#444">delta = 3 (Kolmogorov, self-similar) would be slope 0. Measured turbulence is at delta &#8776; 2.7, i.e. slope (3 - 2.7)/2 = 0.15.</text>

  <!-- ================= PANEL A ================= -->
  <text x="100" y="122" font-size="16" font-weight="bold" fill="#111">delta = 2.7 is almost the flat line</text>

  <line x1="100" y1="450" x2="566" y2="450" stroke="#222" stroke-width="1.6"/>
  <line x1="100" y1="450" x2="100" y2="126" stroke="#222" stroke-width="1.6"/>
  <polygon points="566,450 556,445 556,455" fill="#222"/>
  <polygon points="100,126 95,136 105,136" fill="#222"/>

  <g font-size="12" fill="#555" text-anchor="middle">
    <line x1="100" y1="450" x2="100" y2="455" stroke="#222"/><text x="100" y="472">0</text>
    <line x1="277" y1="450" x2="277" y2="455" stroke="#222"/><text x="277" y="472">5</text>
    <line x1="454" y1="450" x2="454" y2="455" stroke="#222"/><text x="454" y="472">10</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="end">
    <line x1="95" y1="450" x2="100" y2="450" stroke="#222"/><text x="92" y="454">0</text>
    <line x1="95" y1="290" x2="100" y2="290" stroke="#222"/><text x="92" y="294">1</text>
    <line x1="95" y1="130" x2="100" y2="130" stroke="#222"/><text x="92" y="134">2</text>
    <line x1="100" y1="290" x2="560" y2="290" stroke="#eee" stroke-width="1"/>
    <line x1="100" y1="130" x2="560" y2="130" stroke="#eee" stroke-width="1"/>
  </g>

  <!-- delta = 3 flat -->
  <line x1="100" y1="450" x2="560" y2="450" stroke="#7f8c8d" stroke-width="3"/>
  <!-- delta = 2.7, slope 0.15 -->
  <line x1="100" y1="450" x2="560" y2="138" stroke="#c0392b" stroke-width="3"/>
  <!-- delta = 1 for contrast, dashed -->
  <line x1="100" y1="450" x2="171" y2="130" stroke="#e67e22" stroke-width="2.4" stroke-dasharray="7,5"/>

  <text x="470" y="442" font-size="13.5" font-weight="bold" fill="#7f8c8d">delta = 3</text>
  <text x="380" y="196" font-size="13.5" font-weight="bold" fill="#c0392b">delta = 2.7</text>
  <text x="178" y="176" font-size="13" fill="#e67e22">delta = 1</text>
  <text x="178" y="194" font-size="11.5" fill="#999">(for contrast)</text>

  <text x="200" y="404" font-size="12.5" fill="#666">per octave: &#215;2^0.15 &#8776; 1.11  (about 11% more spiky)</text>
  <text x="200" y="426" font-size="12.5" fill="#666">over 13 octaves: &#8776; 4&#215; in total</text>

  <text x="330" y="500" font-size="13.5" text-anchor="middle" fill="#333">octaves (log2 N)  &#8594;  smaller scales</text>
  <text x="44" y="290" font-size="13.5" text-anchor="middle" fill="#333" transform="rotate(-90 44 290)">log2 ( peak / average )</text>

  <!-- ================= PANEL B ================= -->
  <text x="660" y="122" font-size="16" font-weight="bold" fill="#111">the jitter bounces; its MEAN is the number</text>

  <line x1="660" y1="450" x2="1126" y2="450" stroke="#222" stroke-width="1.6"/>
  <line x1="660" y1="450" x2="660" y2="126" stroke="#222" stroke-width="1.6"/>
  <polygon points="1126,450 1116,445 1116,455" fill="#222"/>
  <polygon points="660,126 655,136 665,136" fill="#222"/>

  <g font-size="12" fill="#555" text-anchor="end">
    <line x1="655" y1="450" x2="660" y2="450" stroke="#222"/><text x="652" y="454">0.6</text>
    <line x1="655" y1="322" x2="660" y2="322" stroke="#222"/><text x="652" y="326">1.0</text>
    <line x1="655" y1="194" x2="660" y2="194" stroke="#222"/><text x="652" y="198">1.4</text>
    <line x1="655" y1="130" x2="660" y2="130" stroke="#222"/><text x="652" y="134">1.6</text>
  </g>
  <g font-size="12" fill="#555" text-anchor="middle">
    <line x1="668" y1="450" x2="668" y2="455" stroke="#222"/><text x="668" y="472">1</text>
    <line x1="860" y1="450" x2="860" y2="455" stroke="#222"/><text x="860" y="472">6</text>
    <line x1="1052" y1="450" x2="1052" y2="455" stroke="#222"/><text x="1052" y="472">11</text>
    <line x1="1120" y1="450" x2="1120" y2="455" stroke="#222"/><text x="1120" y="472">13</text>
  </g>

  <!-- mean lines -->
  <line x1="660" y1="287" x2="1120" y2="287" stroke="#c0392b" stroke-width="2" stroke-dasharray="8,5"/>
  <line x1="660" y1="322" x2="1120" y2="322" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="8,5"/>

  <!-- the jitter -->
  <polyline fill="none" stroke="#e67e22" stroke-width="2"
    points="668,220 707,341 745,264 783,191 822,360 860,306 898,236 937,332 975,284 1013,213 1052,348 1090,296 1120,271"/>
  <g fill="#e67e22">
    <circle cx="668" cy="220" r="3.5"/><circle cx="707" cy="341" r="3.5"/><circle cx="745" cy="264" r="3.5"/>
    <circle cx="783" cy="191" r="3.5"/><circle cx="822" cy="360" r="3.5"/><circle cx="860" cy="306" r="3.5"/>
    <circle cx="898" cy="236" r="3.5"/><circle cx="937" cy="332" r="3.5"/><circle cx="975" cy="284" r="3.5"/>
    <circle cx="1013" cy="213" r="3.5"/><circle cx="1052" cy="348" r="3.5"/><circle cx="1090" cy="296" r="3.5"/>
    <circle cx="1120" cy="271" r="3.5"/>
  </g>

  <text x="672" y="279" font-size="12.5" font-weight="bold" fill="#c0392b">mean = 2^0.15 &#8776; 1.11  &#8592;  this is what delta = 2.7 measures</text>
  <text x="672" y="316" font-size="12.5" fill="#7f8c8d">delta = 3 would mean: every octave &#215;1, mean = 1</text>

  <text x="890" y="500" font-size="13.5" text-anchor="middle" fill="#333">octave  &#8594;  smaller scales</text>
  <text x="620" y="290" font-size="13.5" text-anchor="middle" fill="#333" transform="rotate(-90 620 290)">growth factor per octave</text>

  <!-- ================= FOOTNOTES ================= -->
  <text x="60" y="536" font-size="12" fill="#777">delta is an AVERAGE level of saturation, so it is the mean of the local log-log slope &#8212; not the local value at any one scale. The rebound is the intermittency correction: the anomalous part of the scaling.</text>
  <text x="60" y="554" font-size="12" fill="#777">The left panel is exact arithmetic. The right panel is schematic: the wobble is real (anomalous scaling, usually parameterised by an intermittency exponent around 0.25), but these particular values are illustrative.</text>
</svg>
