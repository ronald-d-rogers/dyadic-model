name = "dyadic-model"
version = "0.1.0"
defaultTargets = ["Cascade", "PAdicZeta"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "Cascade"
globs = ["Cascade", "Cascade.+"]

# The p-adic zeta core.  Directory-only glob (like the parent repo's PerronFrobenius
# entry) so that each file builds independently and a half-finished sibling cannot
# turn the library red.
[[lean_lib]]
name = "PAdicZeta"
globs = ["PAdicZeta.+"]
